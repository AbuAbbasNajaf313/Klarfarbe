[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klarfarbe"
version = "0.1.0"
description = "Personal colour assistance for people with red-green colour vision deficiency"
readme = "../README.md"
license = "Apache-2.0"
authors = [{ name = "Mohammad Al-Musawi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
demo = ["opencv-python>=4.8"]
test = ["pytest>=7"]

[project.scripts]
klarfarbe = "klarfarbe.cli:main"

[tool.setuptools]
packages = ["klarfarbe"]
